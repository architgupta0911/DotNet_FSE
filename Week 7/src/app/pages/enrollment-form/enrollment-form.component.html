<section class="form-page">
  <h2>Enrollment Request (Template-Driven)</h2>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <div class="field">
      <label>Student Name</label>
      <input
        name="studentName"
        [(ngModel)]="studentName"
        required
        minlength="3"
        #nameCtrl="ngModel"
      />
      <span class="error-text" *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required</span>
      <span class="error-text" *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters</span>
    </div>

    <div class="field">
      <label>Email</label>
      <input
        name="studentEmail"
        type="email"
        [(ngModel)]="studentEmail"
        required
        email
        #emailCtrl="ngModel"
      />
      <span class="error-text" *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required</span>
      <span class="error-text" *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">Enter a valid email</span>
    </div>

    <div class="field">
      <label>Course ID</label>
      <input
        name="courseId"
        type="number"
        [(ngModel)]="courseId"
        required
        #courseCtrl="ngModel"
      />
      <span class="error-text" *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">Course ID is required</span>
    </div>

    <div class="field">
      <label>Preferred Semester</label>
      <select name="preferredSemester" [(ngModel)]="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="field checkbox">
      <label>
        <input
          name="agreeToTerms"
          type="checkbox"
          [(ngModel)]="agreeToTerms"
          required
          #termsCtrl="ngModel"
        />
        I agree to the terms
      </label>
      <span class="error-text" *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">You must agree to continue</span>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" class="secondary" (click)="enrollForm.resetForm()">Reset</button>
    </div>

    <div class="success" *ngIf="submitted">Enrollment request submitted successfully!</div>
  </form>
</section>
