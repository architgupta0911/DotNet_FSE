<section class="form-page">
  <h2>Enrollment Request (Reactive)</h2>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    <div class="field">
      <label>Student Name</label>
      <input formControlName="studentName" />
      <span class="error-text" *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']">Name is required</span>
    </div>

    <div class="field">
      <label>Email</label>
      <input formControlName="studentEmail" />
      <span class="error-text" *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">Email already taken</span>
    </div>

    <div class="field">
      <label>Course ID</label>
      <input formControlName="courseId" />
      <span class="error-text" *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</span>
    </div>

    <div class="field">
      <label>Preferred Semester</label>
      <select formControlName="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="field checkbox">
      <label>
        <input type="checkbox" formControlName="agreeToTerms" />
        I agree to the terms
      </label>
    </div>

    <div class="field" formArrayName="additionalCourses">
      <label>Additional Courses</label>
      <div *ngFor="let ctrl of additionalCourses.controls; let i = index" class="array-row">
        <input [formControl]="ctrl" placeholder="Course code" />
        <button type="button" class="danger" (click)="removeCourse(i)">Remove</button>
      </div>
      <button type="button" class="secondary" (click)="addCourse()">Add Another Course</button>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    </div>

    <div class="success" *ngIf="submitted">Enrollment request submitted successfully!</div>
  </form>
</section>
